<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ELITE IPTV Recorder</title>
<style>
  :root{
    --bg:#0f1115;--panel:#171a21;--panel2:#1f2430;--text:#f3f4f6;--muted:#9ca3af;
    --blue:#3b82f6;--green:#10b981;--red:#ef4444;--gray:#374151;--gray2:#4b5563;
    --border:#2b3140;--now:#1e293b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#0b0d12,#121622 40%,#0f1115);color:var(--text)}
  h1{margin:0;padding:18px 16px 6px;font-size:22px;letter-spacing:.2px}
  .sub{padding:0 16px 14px;color:var(--muted);font-size:12px}
  .section{margin:12px 12px 0;background:rgba(23,26,33,.92);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.25)}
  .sec-title{padding:14px 14px 10px;font-weight:700;font-size:14px;border-bottom:1px solid rgba(255,255,255,.04)}
  input{width:100%;padding:14px 12px;margin:10px 0 0;border:1px solid var(--border);border-radius:12px;background:#0f131a;color:var(--text);font-size:16px;outline:none}
  input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(59,130,246,.18)}
  #search-input,#m-time,#m-dur{margin-left:12px;margin-right:12px;width:calc(100% - 24px)}
  #search-results,#favorites,#recordings,#log-panel,#epg-panel{padding:12px}
  .result-item,.fav-row,.card,.epg-row{background:var(--panel2);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:12px;margin-bottom:8px}
  .result-item{cursor:pointer;font-size:15px}
  .result-item:active,.fav-row:active,.btn:active{transform:scale(.99)}
  .fav-row{display:flex;align-items:center;gap:8px}
  .fav-name{flex:1;font-size:15px;cursor:pointer}
  .card-name{font-weight:700;margin-bottom:4px}
  .card-status,.epg-time{color:var(--muted);font-size:12px}
  .rec-status{color:#fca5a5}
  .empty{color:var(--muted);font-size:13px;padding:6px 2px}
  .sel-card{margin:12px;padding:12px;border-radius:14px;background:rgba(15,17,21,.7);border:1px solid var(--border)}
  .sel-name{font-size:18px;font-weight:800;margin-bottom:10px}
  .sel-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .btn{border:0;border-radius:12px;padding:11px 14px;color:white;font-weight:700;font-size:14px;cursor:pointer;flex:1;min-width:100px}
  .btn-sm{padding:8px 10px;font-size:12px;min-width:auto;flex:0 0 auto}
  .btn-blue{background:var(--blue)}
  .btn-green{background:var(--green)}
  .btn-red{background:var(--red)}
  .btn-gray{background:var(--gray)}
  .badge{display:inline-block;background:#ef4444;color:#fff;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800}
  .epg-row.epg-now{background:var(--now)}
  .epg-hdr{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .epg-time{flex:1}
  .epg-title{font-size:14px;font-weight:700;line-height:1.25}
  .epg-desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
  .modal{width:min(420px,100%);background:#151922;border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
  .modal h2{margin:0 0 12px;font-size:18px}
  .modal-btns{display:flex;gap:10px;margin-top:14px}
  .log-line{font-size:11px;color:#9ca3af;padding:2px 0;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all}
  .guide-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .guide-head-actions{display:flex;align-items:center;gap:8px}
  .mini-btn{border:1px solid rgba(255,255,255,.08);background:#0f131a;color:#e5e7eb;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer}
  .guide-meta{padding:10px 12px 0;color:#9ca3af;font-size:12px;line-height:1.4}
  #guide-panel{padding:12px;max-height:470px;overflow-y:auto;overscroll-behavior:contain}
  .guide-category-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;padding:12px;max-height:220px;overflow-y:auto;overscroll-behavior:contain}
  .guide-category-card{border:1px solid rgba(255,255,255,.08);background:#111827;color:#e5e7eb;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:700;cursor:pointer;text-align:left}
  .guide-category-card.active{background:var(--blue);border-color:var(--blue)}
  .guide-category-card small{display:block;color:#9ca3af;font-size:11px;font-weight:600;margin-top:4px}
  .guide-channel-window{padding:12px;border:1px solid rgba(255,255,255,.05);border-radius:14px;background:rgba(15,17,21,.7)}
  .guide-channel-window-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
  .guide-channel-window-head .mini-btn{white-space:nowrap}
  .guide-schedule-window{margin-bottom:12px;padding:12px;border:1px solid rgba(255,255,255,.06);border-radius:12px;background:#0f131a}
  .guide-schedule-title{font-size:13px;font-weight:800;margin-bottom:4px}
  .guide-schedule-sub{font-size:11px;color:#9ca3af;line-height:1.35;margin-bottom:10px}
  .guide-schedule-list{display:grid;gap:8px}
  .guide-schedule-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid rgba(255,255,255,.05);border-radius:12px;background:#111827}
  .guide-schedule-row.now{border-color:var(--blue);background:#162238}
  .guide-schedule-row-main{flex:1;min-width:0}
  .guide-schedule-row-title{font-size:13px;font-weight:700;line-height:1.3}
  .guide-schedule-row-meta{font-size:11px;color:#9ca3af;margin-top:3px;line-height:1.35}
  .guide-channel-list{max-height:420px;overflow-y:auto;padding-right:4px;display:grid;gap:8px}
  .guide-channel-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#111827;border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:10px 12px;text-align:left}
  .guide-channel-row.active{border-color:var(--blue);background:#1e293b}
  .guide-channel-row-main{flex:1;cursor:pointer;min-width:0}
  .guide-channel-name{font-size:14px;font-weight:800;line-height:1.25}
  .guide-channel-sub{font-size:11px;color:#9ca3af;margin-top:3px;line-height:1.35}
  .guide-empty{color:#9ca3af;font-size:13px;padding:6px 2px 2px}
  @media (min-width:700px){
    body{max-width:760px;margin:0 auto}
  }
</style>
</head>
<body>
<h1>IPTV Recorder</h1>
<div class="sub" id="srv-status">Connecting…</div>

<div class="section">
  <div class="sec-title" style="cursor:default">Find Channel</div>
  <div id="backup-status" style="font-size:12px;color:#3b82f6;margin-bottom:8px;display:none;padding:0 12px;">
    Backup: <span id="backup-name-disp" style="font-weight:600"></span>
    <span onclick="clearBackup()" style="cursor:pointer;text-decoration:underline;margin-left:8px;color:#9ca3af;">Clear</span>
  </div>
  <input type="search" id="search-input" placeholder="Search channels…" oninput="onSearch()" autocomplete="off">
  <div id="search-results"></div>
  <div id="sel-card" style="display:none">
    <div class="sel-card">
      <div class="sel-name" id="sel-name"></div>
      <div class="sel-btns">
        <button class="btn btn-red btn-sm" onclick="openModal(true)">Record Now</button>
        <button class="btn btn-blue btn-sm" onclick="openModal(false)">Schedule</button>
        <button class="btn btn-sm btn-gray" id="fav-btn" onclick="toggleFav()">Save</button>
        <button class="btn btn-gray btn-sm" onclick="setBackup()">Set Backup</button>
      </div>
      <div id="epg-panel"><div class="empty">Loading guide…</div></div>
    </div>
  </div>
</div>

<div class="section">
  <div class="sec-title" style="cursor:default">Active Recordings</div>
  <div id="recordings"><div class="empty">No active recordings</div></div>
</div>

<div class="section">
  <div class="sec-title guide-head">
    <span>TV Guide</span>
    <div class="guide-head-actions">
      <button class="mini-btn" onclick="refreshGuide(true)">Refresh</button>
    </div>
  </div>
  <div id="guide-meta" class="guide-meta">Loading categories…</div>
  <div id="guide-categories" class="guide-category-list"></div>
  <div id="guide-panel"><div class="guide-empty">Select a category to load its channels.</div></div>
</div>

<div class="section">
  <div class="sec-title" style="cursor:default">Saved Channels</div>
  <div id="favorites"><div class="empty">No saved channels yet</div></div>
</div>

<div class="section">
  <div class="sec-title" onclick="toggleLog()">Recording Log <span id="log-arrow">▶</span></div>
  <div id="log-panel" style="display:none;max-height:220px;overflow-y:auto;margin-top:6px"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modal-title">Schedule Recording</h2>
    <input type="text" id="m-time" placeholder="Start time (07:00 PM)">
    <input type="number" id="m-dur" placeholder="Duration (minutes)" value="180">
    <div class="modal-btns">
      <button class="btn btn-green" style="flex:1" onclick="confirmSchedule()">Schedule</button>
      <button class="btn btn-gray" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
let selId=null,selName=null,allFavs=[],searchTimer=null,logOpen=false,isRecordNow=false;
let guideCategories=[],guideBundle=null,guideSelectedCategoryId='',guideSelectedChannelId='',guideLoading=false,guideError='';

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escAttr(s){return esc(s).replace(/'/g,'&#39;')}
function fmt12(ts){const d=new Date(ts*1000);let h=d.getHours(),m=d.getMinutes();const p=h>=12?'PM':'AM';h=h%12||12;return h+':'+(m<10?'0'+m:m)+' '+p}

function parseGuideTime(value){
  if(value===null||value===undefined||value==='')return null;
  if(typeof value==='number'&&Number.isFinite(value))return value<1e12?value*1000:value;
  const raw=String(value).trim();
  if(!raw)return null;
  if(/^\d+$/.test(raw)){
    const numeric=Number(raw);
    if(!Number.isFinite(numeric))return null;
    return numeric<1e12?numeric*1000:numeric;
  }
  const match=raw.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})(?:\s*([+-])(\d{2})(\d{2}))?/);
  if(match){
    const [,y,mo,d,h,mi,s,sign,oh,om]=match;
    const utcMs=Date.UTC(+y,+mo-1,+d,+h,+mi,+s);
    if(!sign)return utcMs;
    const offsetMs=((+oh*60)+(+om||0))*60000;
    return sign==='+'?utcMs-offsetMs:utcMs+offsetMs;
  }
  const parsed=Date.parse(raw);
  return Number.isNaN(parsed)?null:parsed;
}

function guideRange(listing){
  const startMs=parseGuideTime(listing.start||listing.start_timestamp);
  const stopMs=parseGuideTime(listing.stop||listing.stop_timestamp);
  return {startMs,stopMs};
}

function guideTimeLabel(listing){
  const {startMs,stopMs}=guideRange(listing);
  if(startMs===null||stopMs===null)return 'No time available';
  return `${fmt12(startMs/1000)} – ${fmt12(stopMs/1000)}`;
}

function guideDurationMins(listing){
  const {startMs,stopMs}=guideRange(listing);
  if(startMs===null||stopMs===null)return 0;
  return Math.max(1, Math.round((stopMs-startMs)/60000));
}

function guideIsNow(listing){
  const {startMs,stopMs}=guideRange(listing);
  if(startMs===null||stopMs===null)return false;
  const now=Date.now();
  return startMs<=now&&now<stopMs;
}

function guideProgramTitle(listing){
  const title=String(listing&&listing.title||'').trim();
  return title || 'Untitled';
}

function guideProgramDesc(listing){
  return String(listing&&listing.description||'').trim();
}

function normalizeGuideCategoryName(name){
  return String(name||'').toLowerCase().replace(/[_\-]+/g,' ').replace(/\s+/g,' ').trim();
}

function isAllowedGuideCategory(category){
  const name=normalizeGuideCategoryName(category&&category.category_name);
  if(!name)return false;
  const matches=[
    'usa',
    'u s a',
    'united states',
    'sports',
    'sport',
    'us networks',
    'us network',
    'english',
  ];
  return matches.some(token=>name.includes(token));
}

function guideCategoryName(categoryId){
  const cat=(guideCategories||[]).find(c=>c.category_id===categoryId);
  return cat?cat.category_name:'Categories';
}

function updateGuideMeta(){
  const el=document.getElementById('guide-meta');
  if(!el)return;
  if(guideLoading){
    el.textContent=guideSelectedCategoryId?'Loading channels…':'Loading categories…';
    return;
  }
  if(guideError){
    el.textContent=`Guide unavailable: ${guideError}`;
    return;
  }
  if(!guideSelectedCategoryId){
    el.textContent=guideCategories.length
      ? `${guideCategories.length} categories loaded · select one to reveal its channels`
      : 'Loading categories…';
    return;
  }
  const categoryLabel=guideCategoryName(guideSelectedCategoryId);
  const source=guideBundle.source||'xmltv';
  const generatedAt=guideBundle.generated_at||0;
  const ageMs=generatedAt?Math.max(0,Date.now()-generatedAt):0;
  const ageText=ageMs<60000?'just now':ageMs<3600000?`${Math.floor(ageMs/60000)}m ago`:`${Math.floor(ageMs/3600000)}h ago`;
  const channelTotal=(guideBundle.channels||[]).length;
  el.textContent=`${channelTotal} channels · ${categoryLabel} · ${source} · updated ${ageText}`;
}

function renderGuideCategories(){
  const el=document.getElementById('guide-categories');
  if(!el)return;
  const categories=(guideCategories||[]).filter(isAllowedGuideCategory);
  if(!categories.length){
    el.innerHTML='<div class="guide-empty">No matching categories found.</div>';
    return;
  }
  if(guideSelectedCategoryId && !categories.some(cat=>cat.category_id===guideSelectedCategoryId)){
    guideSelectedCategoryId='';
    guideBundle=null;
    guideError='';
    updateGuideMeta();
    document.getElementById('guide-panel').innerHTML='<div class="guide-empty">Select a category to load its channels.</div>';
  }
  el.innerHTML=categories.map(cat=>`
    <button class="guide-category-card ${guideSelectedCategoryId===cat.category_id?'active':''}" data-category-id="${escAttr(cat.category_id)}" onclick="selectGuideCategory(this.dataset.categoryId)">
      ${esc(cat.category_name)}
      <small>Select to load channels</small>
    </button>
  `).join('');
}

function renderGuideChannel(channel, listings){
  const current=listings.find(guideIsNow) || listings[0] || null;
  const currentText=current ? `${guideTimeLabel(current)} · ${guideProgramTitle(current)}` : 'No guide data available';
  const desc=current?guideProgramDesc(current):'';
  const rowClass=String(guideSelectedChannelId)===String(channel.id)?' active':'';
  return `<div class="guide-channel-row${rowClass}">
    <div class="guide-channel-row-main" data-channel-id="${escAttr(channel.id)}" data-channel-name="${escAttr(channel.name)}" onclick="selectGuideChannel(this.dataset.channelId, this.dataset.channelName)">
      <div class="guide-channel-name">${esc(channel.name)}</div>
      <div class="guide-channel-sub">${esc(currentText)}${desc?` · ${esc(desc.substring(0,80))}`:''}</div>
    </div>
    <button class="mini-btn" data-channel-id="${escAttr(channel.id)}" data-channel-name="${escAttr(channel.name)}" onclick="selectGuideChannel(this.dataset.channelId, this.dataset.channelName)">Open</button>
  </div>`;
}

function renderGuideSchedulePanel(channel, listings){
  if(!channel)return '<div class="guide-empty">Click a channel to preview its schedule.</div>';
  const rows=(listings||[]).map(listing=>{
    const title=guideProgramTitle(listing);
    const desc=guideProgramDesc(listing);
    const now=guideIsNow(listing);
    const safeChannelId=escAttr(channel.id);
    const safeChannelName=escAttr(channel.name);
    const startValue=listing.start||listing.start_timestamp||'';
    const stopValue=listing.stop||listing.stop_timestamp||'';
    return `<div class="guide-schedule-row${now?' now':''}">
      <div class="guide-schedule-row-main">
        <div class="guide-schedule-row-title">${now?'<span class="badge" style="margin-right:6px;">NOW</span>':''}${esc(title)}</div>
        <div class="guide-schedule-row-meta">${esc(guideTimeLabel(listing))}${desc?` · ${esc(desc.substring(0,110))}`:''}</div>
      </div>
      <button class="mini-btn" data-channel-id="${safeChannelId}" data-channel-name="${safeChannelName}" data-start-value="${escAttr(startValue)}" data-stop-value="${escAttr(stopValue)}" onclick="openGuideSchedule(this.dataset.channelId, this.dataset.channelName, this.dataset.startValue, this.dataset.stopValue)">Schedule</button>
    </div>`;
  }).join('');

  return `<div class="guide-schedule-window">
    <div class="guide-schedule-title">Schedule Preview</div>
    <div class="guide-schedule-sub">${esc(channel.name)} · ${listings.length} program${listings.length===1?'':'s'} loaded</div>
    <div class="guide-schedule-list">${rows || '<div class="guide-empty">No schedule data available for this channel.</div>'}</div>
  </div>`;
}

function renderGuidePanel(){
  const panel=document.getElementById('guide-panel');
  if(!panel)return;
  if(!guideSelectedCategoryId){
    panel.innerHTML='<div class="guide-empty">Choose a category above to load its channels.</div>';
    return;
  }
  if(guideLoading && !guideBundle){
    panel.innerHTML='<div class="guide-empty">Loading channels…</div>';
    return;
  }
  if(!guideBundle || !guideBundle.channels){
    panel.innerHTML='<div class="guide-empty">No channels loaded for this category.</div>';
    return;
  }
  const channels=guideBundle.channels||[];
  const guideEpg=guideBundle.guide_epg||{};
  const categoryLabel=guideCategoryName(guideSelectedCategoryId);
  const selectedChannel=channels.find(ch=>String(ch.id)===String(guideSelectedChannelId)) || channels[0] || null;
  const selectedListings=selectedChannel ? (guideEpg[selectedChannel.id]||[]) : [];
  panel.innerHTML=`<div class="guide-channel-window">
    <div class="guide-channel-window-head">
      <div>
        <div class="guide-category-title">${esc(categoryLabel)}</div>
        <div class="guide-category-count">${channels.length} channels</div>
      </div>
      <button class="mini-btn" onclick="clearGuideSelection()">Back to categories</button>
    </div>
    ${renderGuideSchedulePanel(selectedChannel, selectedListings)}
    <div class="guide-channel-list">
      ${channels.length ? channels.map(ch=>renderGuideChannel(ch, guideEpg[ch.id]||[])).join('') : '<div class="guide-empty">No channels in this category.</div>'}
    </div>
  </div>`;
}

function selectGuideChannel(channelId, channelName){
  guideSelectedChannelId=String(channelId||'');
  renderGuidePanel();
  selectChannel(channelId, channelName);
}

function selectGuideCategory(categoryId){
  guideSelectedCategoryId=String(categoryId||'');
  guideSelectedChannelId='';
  guideBundle=null;
  renderGuideCategories();
  renderGuidePanel();
  refreshGuide(true);
}

function clearGuideSelection(){
  guideSelectedCategoryId='';
  guideSelectedChannelId='';
  guideBundle=null;
  guideError='';
  renderGuideCategories();
  renderGuidePanel();
  updateGuideMeta();
}

async function refreshGuide(force=false){
  if(guideLoading)return;
  guideLoading=true;
  guideError='';
  updateGuideMeta();
  try{
    const categories=await fetch('/api/categories').then(r=>r.json());
    guideCategories=(Array.isArray(categories)?categories:[]).filter(isAllowedGuideCategory);
    renderGuideCategories();

    if(!guideSelectedCategoryId){
      guideBundle=null;
      renderGuidePanel();
      return;
    }

    const params=new URLSearchParams({category_id:guideSelectedCategoryId,limit:'24'});
    if(force)params.set('refresh','1');
    const bundle=await fetch(`/api/guide?${params.toString()}`).then(r=>r.json());
    guideBundle=bundle;
    renderGuidePanel();
  }catch(err){
    guideError=err.message||'request failed';
    guideBundle=null;
    renderGuidePanel();
  }finally{
    guideLoading=false;
    updateGuideMeta();
  }
}

function openGuideSchedule(channelId, channelName, startValue, stopValue){
  selectChannel(channelId, channelName);
  const startMs=parseGuideTime(startValue);
  const stopMs=parseGuideTime(stopValue);
  if(startMs!==null){
    document.getElementById('m-time').value=fmt12(startMs/1000);
  }
  if(startMs!==null && stopMs!==null){
    document.getElementById('m-dur').value=Math.max(1, Math.round((stopMs-startMs)/60000));
  }
  openModal(false);
}

function refreshStatus(){
  fetch('/api/status').then(r=>r.json()).then(d=>{
    document.getElementById('srv-status').textContent=d.status;
    const bDisp=document.getElementById('backup-status');
    if(d.backup_name){
      document.getElementById('backup-name-disp').textContent=d.backup_name;
      bDisp.style.display='block';
    }else{
      bDisp.style.display='none';
    }
    const el=document.getElementById('recordings');
    if(!d.recordings.length){el.innerHTML='<div class="empty">No active recordings</div>';return}
    el.innerHTML=d.recordings.map((r,i)=>`
      <div class="card">
        <div class="card-name">${esc(r.name)}</div>
        <div class="card-status${r.status==='recording'?' rec-status':''}">${esc(r.status_text)}</div>
        ${r.stoppable?`<button class="btn btn-red btn-sm" onclick="stopJob(${i})">Stop</button>`:''}
      </div>`).join('');
  }).catch(()=>{});
}

function refreshFavs(){
  fetch('/api/favorites').then(r=>r.json()).then(favs=>{
    allFavs=favs;
    const el=document.getElementById('favorites');
    if(!favs.length){el.innerHTML='<div class="empty">No saved channels yet</div>';return}
    el.innerHTML=favs.map(f=>`
      <div class="fav-row">
        <span class="fav-name" onclick="selectFav('${esc(f.id)}','${esc(f.name)}')">${esc(f.name)}</span>
        <button class="btn btn-blue btn-sm" onclick="selectFav('${esc(f.id)}','${esc(f.name)}')">Select</button>
        <button class="btn btn-gray btn-sm" onclick="removeFav('${esc(f.name)}')">✕</button>
      </div>`).join('');
    updateFavBtn();
  }).catch(()=>{});
}

function selectFav(id,name){document.getElementById('search-input').value='';selectChannel(id,name);window.scrollTo({top:0,behavior:'smooth'});}

function updateFavBtn(){
  if(!selId)return;
  const saved=allFavs.some(f=>f.id===selId);
  const btn=document.getElementById('fav-btn');
  btn.textContent=saved?'Saved ✓':'Save';
  btn.className='btn btn-sm '+(saved?'btn-green':'btn-gray');
}

function toggleFav(){
  if(!selId)return;
  const saved=allFavs.some(f=>f.id===selId);
  const url=saved?'/api/favorites/remove':'/api/favorites/add';
  const body=saved?{name:selName}:{name:selName,id:selId};
  fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(()=>refreshFavs());
}

function removeFav(name){
  fetch('/api/favorites/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})})
    .then(()=>refreshFavs());
}

function onSearch(){
  clearTimeout(searchTimer);
  const q=document.getElementById('search-input').value.trim();
  if(!q){document.getElementById('search-results').innerHTML='';return}
  searchTimer=setTimeout(()=>{
    fetch('/api/channels?q='+encodeURIComponent(q))
      .then(r=>r.json()).then(renderResults).catch(()=>{});
  },350);
}

function renderResults(channels){
  const el=document.getElementById('search-results');
  if(!channels.length){el.innerHTML='<div class="empty">No matches</div>';return}
  el.innerHTML=channels.map(c=>`<div class="result-item" onclick="selectChannel('${esc(c.id)}','${esc(c.name)}')">${esc(c.name)}</div>`).join('');
}

function selectChannel(id,name){
  selId=id;selName=name;
  document.getElementById('search-input').value=name;
  document.getElementById('search-results').innerHTML='';
  document.getElementById('sel-name').textContent=name;
  document.getElementById('sel-card').style.display='block';
  document.getElementById('epg-panel').innerHTML='<div class="empty">Loading guide…</div>';
  updateFavBtn();
  fetch('/api/epg?channel_id='+id).then(r=>r.json()).then(d=>renderEpg(d.listings))
    .catch(()=>{document.getElementById('epg-panel').innerHTML='<div class="empty">No guide data</div>';});
}

function renderEpg(listings){
  const el=document.getElementById('epg-panel');
  if(!listings||!listings.length){el.innerHTML='<div class="empty">No guide data</div>';return}
  const now=Date.now();
  el.innerHTML=listings.map(l=>{
    const title=guideProgramTitle(l);
    const desc=guideProgramDesc(l);
    const startMs=parseGuideTime(l.start||l.start_timestamp);
    const stopMs=parseGuideTime(l.stop||l.stop_timestamp);
    const isNow=startMs!==null&&stopMs!==null&&startMs<=now&&now<stopMs;
    const timeText=startMs!==null&&stopMs!==null ? `${fmt12(startMs/1000)} – ${fmt12(stopMs/1000)}` : 'No time available';
    const durationMins=startMs!==null&&stopMs!==null ? Math.max(1, Math.round((stopMs-startMs)/60000)) : 0;
    return `<div class="epg-row${isNow?' epg-now':''}">
      <div class="epg-hdr">
        ${isNow?'<span class="badge">NOW</span>':''}
        <span class="epg-time">${esc(timeText)}</span>
        <button class="btn btn-gray btn-sm" onclick="setEpgTime('${esc(startMs!==null?fmt12(startMs/1000):'')}', ${durationMins})">Set</button>
      </div>
      <div class="epg-title">${esc(title)}</div>
      ${desc?`<div class="epg-desc">${esc(desc.substring(0,120))}</div>`:''}
    </div>`;
  }).join('');
}

function setEpgTime(t, d){document.getElementById('m-time').value=t;if(d)document.getElementById('m-dur').value=d;openModal(false)}

function openModal(now=false){
  if(!selId){alert('Select a channel first');return}
  isRecordNow=now;
  document.getElementById('modal-title').textContent=now?'Record Now: '+selName:'Schedule: '+selName;
  document.getElementById('m-time').style.display=now?'none':'block';
  document.getElementById('overlay').style.display='flex';
}
function closeModal(){document.getElementById('overlay').style.display='none'}
function confirmSchedule(){
  const dur=parseInt(document.getElementById('m-dur').value);
  if(!dur){alert('Enter duration');return}
  let time='NOW';
  if(!isRecordNow){
    time=document.getElementById('m-time').value.trim();
    if(!time){alert('Enter a start time');return}
  }
  fetch('/api/schedule',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({channel_id:selId,channel_name:selName,start_time:time,duration_mins:dur})
  }).then(r=>r.json()).then(d=>{closeModal();alert(d.message)}).catch(()=>alert('Error'));
}
function setBackup(){
  if(!selId)return;
  fetch('/api/backup/set',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:selId,name:selName})
  }).then(r=>r.json()).then(d=>{refreshStatus();alert(d.message);}).catch(()=>alert('Error'));
}
function clearBackup(){
  fetch('/api/backup/clear',{method:'POST'}).then(()=>refreshStatus());
}
function stopJob(i){
  if(!confirm('Stop this recording?'))return;
  fetch('/api/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:i})})
    .then(r=>r.json()).then(d=>alert(d.message));
}

function toggleLog(){
  logOpen=!logOpen;
  document.getElementById('log-panel').style.display=logOpen?'block':'none';
  document.getElementById('log-arrow').textContent=logOpen?'▼':'▶';
  if(logOpen)refreshLog();
}
function refreshLog(){
  fetch('/api/log').then(r=>r.json()).then(d=>{
    document.getElementById('log-panel').innerHTML=
      d.entries.slice().reverse().map(e=>`<div class="log-line">${esc(e)}</div>`).join('');
  }).catch(()=>{});
}

document.getElementById('overlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('overlay'))closeModal();
});

refreshStatus();refreshFavs();refreshGuide();
setInterval(refreshStatus,2000);
setInterval(refreshFavs,20000);
setInterval(()=>{if(!guideLoading)refreshGuide(false)},600000);
setInterval(()=>{if(logOpen)refreshLog()},5000);
</script>
</body>
</html>
